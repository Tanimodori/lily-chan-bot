name: orchestrator

run-name: "${{ inputs.repo }}#${{ inputs.issue }} · ${{ inputs.issue_title || '（未提供标题）' }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: issue 所在仓库（owner/name，config/repos.json 的键）
        required: true
        type: string
      issue:
        description: issue 编号
        required: true
        type: string
      issue_title:
        description: issue 标题（仅用于 run 名称）
        required: false
        type: string
      comment_id:
        description: 触发评论 id（issue_comment 事件，用于 gate 校验）
        required: false
        type: string
      placeholder_comment_id:
        description: A 侧占位评论 id，finalize 用它 PATCH 最终结论
        required: false
        type: string
      event:
        description: 事件类型：issues 或 issue_comment
        required: true
        type: string
      dry_run:
        description: 为 true 时只跑 gate/analysis、不发评论
        required: false
        default: "false"
        type: string
      request_id:
        description: A 侧控制 run id，用于忽略当前占位评论
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: gt6ce-${{ inputs.repo }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      reason: ${{ steps.gate.outputs.reason }}
      snapshot_hash: ${{ steps.gate.outputs.snapshot_hash }}
      code_repo: ${{ steps.gate.outputs.code_repo }}
      code_ref: ${{ steps.gate.outputs.code_ref }}
      code_refs: ${{ steps.gate.outputs.code_refs }}
      golden_repo: ${{ steps.gate.outputs.golden_repo }}
      golden_commit: ${{ steps.gate.outputs.golden_commit }}
      cache_prefix: ${{ steps.gate.outputs.cache_prefix }}
      issue_title: ${{ steps.gate.outputs.issue_title }}
    steps:
      - uses: actions/checkout@v4
      - name: Gate (read-only)
        id: gate
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment_id }}
          EVENT: ${{ inputs.event }}
          REQUEST_ID: ${{ inputs.request_id }}
          SELF_TOKEN: ${{ github.token }}
          B_REPO: ${{ github.repository }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          MODEL_HEALTH: ${{ vars.MODEL_HEALTH }}
        run: python scripts/gate.py
      - name: Upload gate inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ github.run_id }}
          path: inputs/
          if-no-files-found: ignore
          retention-days: 30

  analysis:
    needs: gate
    if: needs.gate.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    environment: llm
    steps:
      - uses: actions/checkout@v4
      - name: Download gate inputs
        uses: actions/download-artifact@v4
        with:
          name: gate-${{ github.run_id }}
          path: inputs
      - name: Restore GT6 mirror
        uses: actions/cache/restore@v4
        with:
          path: .cache/gt6.git
          key: ${{ needs.gate.outputs.cache_prefix }}-${{ github.run_id }}
          restore-keys: ${{ needs.gate.outputs.cache_prefix }}-
      - name: Restore golden mirror
        uses: actions/cache/restore@v4
        with:
          path: .cache/golden.git
          key: golden-${{ needs.gate.outputs.golden_commit }}
          restore-keys: golden-
      - name: Sync mirror and create worktrees
        env:
          CODE_REPO: ${{ needs.gate.outputs.code_repo }}
          CODE_REFS: ${{ needs.gate.outputs.code_refs }}
          GOLDEN_REPO: ${{ needs.gate.outputs.golden_repo }}
          GOLDEN_COMMIT: ${{ needs.gate.outputs.golden_commit }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          if [ -d .cache/gt6.git ]; then
            git -C .cache/gt6.git remote set-url origin "https://github.com/$CODE_REPO.git"
            # 缓存会带上一次运行的 worktree 注册信息；工作区路径变化后 fetch 会拒绝更新已登记的分支。
            git -C .cache/gt6.git worktree prune
            rm -rf .cache/gt6.git/worktrees
            git -C .cache/gt6.git fetch --prune --tags
          else
            git clone --mirror "https://github.com/$CODE_REPO.git" .cache/gt6.git
          fi
          worktree_root="$PWD/code"
          mkdir -p "$worktree_root"
          primary=""
          for ref in $CODE_REFS; do
            slug=$(printf '%s' "$ref" | tr '/ ' '__')
            if [ -z "$primary" ]; then
              git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" "$ref" || \
                git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" master
              primary="$slug"
            else
              git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" "$ref" || \
                echo "ref $ref unavailable; skipping"
            fi
          done
          ln -sfn "$primary" code/current
          # golden 是上游原版 GT6 的固定提交：6CE 的行号引用与行为对齐都以它为基准，
          # 因此诊断时需要能直接读到这份参照实现，而不是靠记忆复述。
          if [ -n "${GOLDEN_REPO:-}" ] && [ -n "${GOLDEN_COMMIT:-}" ]; then
            if [ -d .cache/golden.git ]; then
              git -C .cache/golden.git remote set-url origin "https://github.com/$GOLDEN_REPO.git"
              git -C .cache/golden.git worktree prune
              rm -rf .cache/golden.git/worktrees
              git -C .cache/golden.git fetch --prune --tags || true
            else
              git clone --mirror "https://github.com/$GOLDEN_REPO.git" .cache/golden.git
            fi
            if git -C .cache/golden.git cat-file -e "$GOLDEN_COMMIT^{commit}" 2>/dev/null; then
              git -C .cache/golden.git worktree add -f "$worktree_root/golden" "$GOLDEN_COMMIT"
              echo "golden: $GOLDEN_REPO@$GOLDEN_COMMIT"
            else
              echo "golden commit $GOLDEN_COMMIT not reachable; skipping"
            fi
          fi
      - name: Build code manifest
        env:
          REPO: ${{ inputs.repo }}
        run: python scripts/manifest.py
      - name: Save GT6 mirror
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/gt6.git
          key: ${{ needs.gate.outputs.cache_prefix }}-${{ github.run_id }}
      - name: Save golden mirror
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/golden.git
          key: golden-${{ needs.gate.outputs.golden_commit }}
      - name: Install Codex CLI (pin before production)
        run: npm install -g @openai/codex@0.166.0
      - name: Provision runtimes
        # agent 会写脚本自检答案，需要能直接用 node 与 python；镜像自带解释器，缺的是包。
        # 版本固定，避免同一 issue 在不同时间得出不同结论。
        run: |
          set -euo pipefail
          node --version
          python --version
          python -m pip install --disable-pip-version-check --quiet \
            "pyyaml==6.0.3" "pillow==13.0.0"
          python - <<'PY'
          import PIL
          import yaml
          print(f"pyyaml {yaml.__version__} / pillow {PIL.__version__}")
          PY
      - name: Prefetch attachments
        run: python scripts/prefetch.py
      - name: Run Codex under supervisor
        id: supervisor
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          MODEL_KEY_MISTRAL: ${{ secrets.MODEL_KEY_MISTRAL }}
          MODEL_KEY_CLINEPASS: ${{ secrets.MODEL_KEY_CLINEPASS }}
        run: python scripts/agent_supervisor.py
      # 上传闸门：任一文件扫描失败就不提供产物目录，避免未脱敏内容进入公开 artifact。
      - name: Upload analysis outputs
        if: always() && steps.supervisor.outputs.scan_upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ github.run_id }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 30
      # 扫描失败时只留报告：result.json 自身已脱敏，只含状态与命中清单。
      - name: Upload scan report
        if: always() && steps.supervisor.outputs.scan_upload != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ github.run_id }}-report
          path: outputs/result.json
          if-no-files-found: ignore
          retention-days: 30

  # 确定性写入。不运行 agent，不读 issue 正文作为指令，只消费 gate/analysis 的结构化产物。
  # 除 dry_run 的写回外，finalize 总是运行：analysis 失败、超时或被取消都要回写失败结论。
  finalize:
    needs: [gate, analysis]
    if: always() && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: writer
    steps:
      - uses: actions/checkout@v4
      - name: Download gate inputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gate-${{ github.run_id }}
          path: inputs
      - name: Download analysis outputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: analysis-${{ github.run_id }}
          path: outputs
      - name: Download scan report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: analysis-${{ github.run_id }}-report
          path: outputs
      - name: App token (issues:write on issue repository)
        id: app_issue
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
          owner: GregTech6CE
          repositories: GregTech6
          permission-issues: write
      # actions/create-github-app-token 没有 permission-variables 输入，
      # 这里使用 App 的完整权限集；该 job 不运行 agent，也不接触不可信正文。
      - name: App token (health variable)
        id: app_health
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
      - name: Render
        if: always()
        continue-on-error: true
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          B_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f outputs/result.json ]; then
            if [ -f inputs/verdict.json ] && ! python -c 'import json,sys;sys.exit(0 if json.load(open("inputs/verdict.json")).get("decision")=="proceed" else 1)'; then
              echo "gate skipped; no analysis result"
              exit 0
            fi
          fi
          SNAPSHOT=$(python -c 'import json;print(json.load(open("inputs/snapshot.json")).get("sha256",""))' 2>/dev/null || true)
          TITLE=$(python -c 'import json;print(json.load(open("inputs/snapshot.json")).get("issue",{}).get("title",""))' 2>/dev/null || true)
          STATUS=$(python -c 'import json;print(json.load(open("outputs/result.json")).get("status","failed"))' 2>/dev/null || echo failed)
          REASON=$(python -c 'import json;print(json.load(open("outputs/result.json")).get("reason",""))' 2>/dev/null || true)
          python scripts/render.py \
            --repo "$REPO" --issue "$ISSUE" \
            --issue-title "$TITLE" --snapshot "$SNAPSHOT" \
            --relevance outputs/relevance.json \
            --run-url "$B_RUN_URL" \
            --status "$STATUS" --reason "$REASON"
      - name: Cleanup skipped placeholder
        if: ${{ always() && (inputs.dry_run || 'false') != 'true' }}
        continue-on-error: true
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.placeholder_comment_id }}
          GH_RW_TOKEN: ${{ steps.app_issue.outputs.token }}
        run: |
          set -euo pipefail
          if [ -f outputs/result.json ]; then exit 0; fi
          if [ -f inputs/verdict.json ] && ! python -c 'import json,sys;sys.exit(0 if json.load(open("inputs/verdict.json")).get("decision")=="proceed" else 1)'; then
            python scripts/control.py cleanup
          fi
      - name: Write back
        if: ${{ always() && (inputs.dry_run || 'false') != 'true' }}
        continue-on-error: true
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.placeholder_comment_id }}
          GH_RW_TOKEN: ${{ steps.app_issue.outputs.token }}
          GH_RO_TOKEN: ${{ steps.app_issue.outputs.token }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ ! -f outputs/comment.md ]; then exit 0; fi
          SNAPSHOT=$(python -c 'import json;print(json.load(open("inputs/snapshot.json")).get("sha256",""))' 2>/dev/null || true)
          SNAPSHOT_HASH="$SNAPSHOT" python scripts/write_back.py
      - name: Update model health
        if: always()
        continue-on-error: true
        env:
          MODEL_HEALTH_TOKEN: ${{ steps.app_health.outputs.token }}
          B_REPO: ${{ github.repository }}
          MODEL_HEALTH_PATH: outputs/model_health.json
        run: python scripts/update_health.py
